# Copy to config.yaml and edit. Nothing sensitive belongs in this file —
# the API token goes in .env instead (see .env.example).

# Your app's ID from https://developers.deriv.com/dashboard > Registered apps.
# Deriv retired the old numeric app_ids (e.g. 1089) along with the Legacy API;
# current app IDs are alphanumeric strings. Create a "Native apps (PAT)" app.
# The app ids already registered for this project. An app_id is a PUBLIC
# client identifier, not a secret - the PAT in .env is the secret. Account 1
# uses this one; account 2 overrides it with --app-id 343GsiWjpyIskHP1nbTzi
# (see tools/install_sr_task.ps1).
app_id: 33ULSRYkmDK8Y515CmE1l
symbol: R_100        # Volatility 100 Index — a common Digits-trading symbol
stake: 1.00
currency: USD
backtest_ticks: 5000  # how many historical ticks `backtest` pulls

strategy:
  # digit_frequency | even_odd_frequency | streak_reversal | low_edge |
  # rotation | adaptive_bias | quota_rotation  (see README "Strategies")
  name: digit_frequency
  window: 100                 # how many recent digits to track (frequency strategies)
  threshold: 0.03              # deviation from baseline before a signal fires (frequency strategies)
  over_under_barrier: 4         # Over/Under split point (digit_frequency, streak_reversal)
  # streak_reversal also takes streak_len (default 4); even_odd_frequency
  # only takes window/threshold; low_edge takes every (tick cadence,
  # default 15), contract_type (default DIGITOVER) and barrier (default 0)
  # — run scan-edge and point it at whatever is currently cheapest.
  # low_edge contract_type accepts the digit contracts plus CALL/PUT
  # (Rise/Fall). Measured July 2026: Rise/Fall ~3.8% margin vs 2.17% for
  # DIGITOVER 0 — Rise/Fall looks like "real trading" but costs ~75% more.
  #
  # quota_rotation guarantees each contract FAMILY trades its share —
  # unlike adaptive_bias, which silently only ever bets the highest-
  # probability contract in its list (a bug we found and kept documented,
  # not fixed in place, so the failure mode stays visible):
  #   name: quota_rotation
  #   every: 6            # tick cadence
  #   window: 50           # digits of history before scoring kicks in
  #   mode: momentum        # momentum | reversion, scores legs WITHIN a family
  #   families:
  #     - [over_under, ["DIGITOVER:0", "DIGITUNDER:9"], 0.5]
  #     - [even_odd,   ["DIGITEVEN", "DIGITODD"],       0.25]
  #     - [rise_fall,  ["CALL", "PUT"],                 0.25]
  #
  # Unsupported keys for the chosen strategy will raise a TypeError —
  # remove ones that don't apply.

risk:
  max_daily_loss: 20.0       # stop for the session once total loss reaches this
  max_consecutive_losses: 5   # stop after this many losing trades in a row
  max_trades: 50               # stop after this many trades regardless of outcome
  # target_profit: 100.0      # optional: stop (happily) once daily PnL reaches this.
  #                           # Honest note: with negative-EV contracts a profit
  #                           # target mostly determines *how* you stop, not whether
  #                           # you profit — see README.

journal_path: trade_journal.csv
