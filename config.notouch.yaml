# Touch/No Touch only. Separate file so the digit bot's config.yaml (now
# stopped in favour of this) and config.pricebot.yaml (multiplier, manual
# only) are both untouched.
#
# REPLACES the digit bot (categories: [even, rise] on R_10/25/50/75,
# ~3.0% blended margin) rather than running alongside it - see
# OPERATING_STATE.md for the reasoning and the numbers this was chosen from.
#
# Day-level risk (max-daily-loss / target-profit) is NOT set here: pricebot
# has no RiskManager of its own (that is digit-bot-only). It is enforced by
# tools/risefall_supervisor.py's own --max-daily-loss/--target-profit flags,
# which read the journal directly - see tools/install_risefall_task.ps1
# -ConfigPath config.notouch.yaml -MaxDailyLoss 2000 -TargetProfit 2000.
#
# === HIGH-VARIANCE MODE (2026-07-31) ===
# This config was switched from a high-win-rate/low-payout shape (93-96% win,
# $0.11-$0.27 per win) to a LOW-win-rate/HIGH-payout shape (30-53% win,
# $8.60-$22.12 per win on $10 stake) at the user's explicit request, to give
# a real chance at +$300-500/day outcomes through VARIANCE, not through edge.
#
# This is NOT a profitable strategy. The expected daily loss is ~$346 (the
# same ~2.3% margin as every other config, just at higher stake). What
# changed is the SHAPE: instead of a slow steady bleed with almost no chance
# of a big winning day, this config has high daily variance — roughly:
#   P(+$300 day): ~7.7%  (1 in 13 days)
#   P(+$500 day): ~3.1%  (1 in 33 days)
#   P(-$500 day): ~36.6%
#   expected account lifetime at $9000: ~26 days
#
# The user understands this is a negative-edge game and chose to trade
# variance for a shot at big days, on a DEMO account. No recovery/martingale
# scheme is used — flat staking only, because recovery is provably worse
# (see tools/martingale_sim.py and the simulation results in the plan file).
app_id: 33ULSRYkmDK8Y515CmE1l
currency: USD
journal_path: notouch_journal.csv

pricebot:
  instrument: touch

  # Same 5 symbols as the safe config, but at 0.10% barrier instead of
  # 0.30-0.50%. At 0.10% the win rate drops to 30-53% (varies by symbol
  # volatility) but the payout per win jumps to $18-32 on a $10 stake.
  # This is what creates the daily variance — big wins, big losses, same
  # negative edge.
  symbols: [R_50, R_75, R_100, 1HZ50V, 1HZ75V]

  stake: 10.00
  max_stake: 10.00

  # Same 5-minute duration as before.
  duration: 5
  duration_unit: m

  # Flat staking only. No martingale, no recovery ladder, no stake
  # progression of any kind — every trade is $10, regardless of prior
  # outcomes. Recovery schemes are provably worse than flat on this
  # bot's own measured numbers (see tools/martingale_sim.py).
  staking:
    name: flat

  granularity: 60
  poll_seconds: 20

  strategy:
    name: fixed_notouch
    # 0.10% barrier on every symbol — the aggressive/low-win-rate/high-payout
    # shape. Measured win rates at 5m/0.10%:
    #   R_50     52.5%  payout ~$18.60  margin 2.37%
    #   R_75     38.1%  payout ~$25.60  margin 2.45%
    #   R_100    30.4%  payout ~$32.12  margin 2.34%
    #   1HZ50V   51.7%  payout ~$18.88  margin 2.40%
    #   1HZ75V   37.1%  payout ~$26.30  margin 2.44%
    barrier_pct: 0.001
    horizon_seconds: 300
    # No per-symbol overrides — 0.10% on everything. The win rate varies
    # naturally by symbol volatility (R_100 is most volatile = lowest win
    # rate = highest payout per win = most variance contribution).
